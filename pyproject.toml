[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-resolve-agent"
dynamic = ["version"]
description = "Provider-neutral local automation framework for video editors"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "av>=11,<19",
  "faster-whisper==1.2.1",
  "jsonschema>=4.23,<5",
  "mcp>=2.0,<3",
  "numpy>=1.23.5,<2.3",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "lupa>=2,<3",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
  "tomli>=2.0.1",
  "types-jsonschema>=4.23",
]

[project.scripts]
davinci-agent = "agent.cli:main"
davinci-agent-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = [
  "agent",
  "bridges",
  "bridges.resolve",
  "config",
  "contracts",
  "mcp_server",
  "providers",
  "providers.audio",
  "providers.resolve",
  "providers.transcription",
  "transports",
]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "agent.__version__"}

[tool.setuptools.package-data]
"bridges.resolve" = ["*.lua"]
"providers.resolve" = ["ResolveRecordingUI.ps1"]
config = [
  "*.toml",
  "recipes/*.json",
  "animation_templates/*.json",
  "color_presets/*.json",
  "fusion_templates/Edit/Titles/*.setting",
]
contracts = ["*.json", "examples/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["^build/"]
files = [
  "agent",
  "bridges",
  "config",
  "mcp_server",
  "providers",
  "scripts",
  "transports",
  "tests",
]
